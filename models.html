<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>十英雄模型校准</title><script type="importmap">{"imports":{"three":"./js/vendor/three.module.js"}}</script><style>body{margin:30px;background:#102329;color:#dbe9df;font:14px system-ui}a{color:#dfc68a}h1{font-size:24px}button,select{padding:10px;margin:10px;background:#28453f;color:#fff;border:1px solid #849c84}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}article{background:#1c3538;border:1px solid #60766e;border-radius:8px;text-align:center}canvas{width:220px;height:230px}p{color:#a8c5b9}</style><a href="index.html">← 返回游戏</a><h1>十英雄模型 · 脚底与朝向校准</h1><p>十字是实际逻辑坐标，圆圈是脚底参考。切换四个方向，检查武器和尾巴不再带偏旋转中心。</p><select id="pose"><option value="idle">待机</option><option value="run">移动</option><option value="q">Q 动画</option></select><button id="turn">转身 90°</button><span id="model-status"></span><main id="grid"></main><script type="module">
import './js/champion-models.js';
const ids=['garen','darius','ashe','caitlyn','ahri','lux','annie','yi','malphite','soraka'],names=['盖伦','德莱厄斯','艾希','凯特琳','阿狸','拉克丝','安妮','易','墨菲特','索拉卡'];let angle=0;
document.getElementById('turn').onclick=()=>angle+=Math.PI/2;
const actors=ids.map((id,i)=>{const card=document.createElement('article');card.innerHTML=`<h2>${names[i]}</h2><canvas width="440" height="460"></canvas>`;document.getElementById('grid').append(card);return {ctx:card.querySelector('canvas').getContext('2d'),unit:{id:'preview-'+id,def:{id},x:110,y:160,order:{type:'stop'},faceAngle:0}};});
function render(now){const t=now/1000,pose=document.getElementById('pose').value;for(const {ctx,unit} of actors){ctx.setTransform(2,0,0,2,0,0);ctx.clearRect(0,0,220,230);ctx.strokeStyle='#83b7a2';ctx.lineWidth=1;ctx.beginPath();ctx.ellipse(110,160,27,13,0,0,7);ctx.moveTo(70,160);ctx.lineTo(150,160);ctx.moveTo(110,140);ctx.lineTo(110,185);ctx.stroke();unit.faceAngle=angle;unit.order.type=pose==='run'?'move':'stop';unit.heroAnim=pose==='q'?{type:'q',start:Math.floor(t/2)*2,dur:1}:null;window.RiftModels.draw(ctx,{t},unit);}requestAnimationFrame(render);}requestAnimationFrame(render);
</script></html>
