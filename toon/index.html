<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>手绘峡谷 · Toon Rift</title>
<script>
// 每次打开都给脚本和样式带上新版本号，避免浏览器用旧缓存（改完代码刷新即生效）
(() => {
  const v = Date.now();
  const mods = ['main', 'toon-kit', 'rig', 'hero-models', 'heroes', 'props', 'vfx', 'units', 'world', 'map', 'ai', 'hud', 'game', 'stage',
    'audio', 'items', 'shop', 'cursor', 'icons', 'indicator', 'summoners'];
  const imports = { three: '../js/vendor/three.module.js' };
  for (const m of mods) imports['./js/' + m + '.js'] = './js/' + m + '.js?v=' + v;
  const map = document.createElement('script');
  map.type = 'importmap'; map.textContent = JSON.stringify({ imports });
  document.currentScript.after(map);
  document.write('<link rel="stylesheet" href="css/toon.css?v=' + v + '">');
  window.__toonVersion = v;
})();
</script>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="overlay"></canvas>
<div id="paper"></div>

<!-- 加载 -->
<div id="loading">
  <div class="ink-title">手绘峡谷<small>TOON RIFT</small></div>
  <div id="load-msg">正在削铅笔……</div>
  <div class="bar"><i id="load-bar"></i></div>
</div>

<!-- 选人 -->
<section id="select" class="hidden">
  <header class="brand"><h1>手绘峡谷</h1><p>十位英雄 · 所有模型、地图与特效都由代码一笔一笔画出来</p></header>
  <div id="roster"></div>
  <aside id="info" class="paper-panel"></aside>
  <div id="stage-ctrl" class="paper-panel">
    <button data-k="A"><span>普攻</span></button>
    <button data-k="Q"></button><button data-k="W"></button><button data-k="E"></button><button data-k="R"></button>
    <button data-k="RUN"><span>跑动</span></button>
    <button id="btn-lineup"><span>全员合影</span></button>
  </div>
  <div id="spell-pick" class="paper-panel"></div>
  <button id="start">进入峡谷 <b>→</b></button>
</section>

<!-- 对局 HUD -->
<section id="hud" class="hidden">
  <div id="scoreboard"><span id="score-blue">0</span><em id="clock">00:00</em><span id="score-red">0</span></div>
  <div id="topleft">
    <button id="btn-pause">暂停 (Esc)</button><button id="btn-lock">镜头：锁定 (Y)</button><button id="btn-shop">商店 (P)</button><button id="btn-atk">攻击范围：自动</button><button class="btn-sound">音效：开 (M)</button><button class="btn-music">音乐：开 (N)</button>
    <p>右键移动/攻击 · A 攻击鼠标附近的敌人（附近没有就攻击移动）· 按住 Q W E R 瞄准、松开施放（右键取消） · Shift+Q/W/E/R 加点 · D 闪现 · F 治疗 · 1-6 用药水 · P 商店 · B 回城 · 空格回中 · Tab 战绩</p>
  </div>
  <div id="topright"><div id="target-panel" class="paper-panel hidden"></div><div id="killfeed"></div></div>
  <div id="hud-bottom" class="paper-panel">
    <div id="hud-stats"></div>
    <div class="who"><div class="face-col"><div id="hud-face" class="face"><img id="hud-portrait"><span id="hud-level">1</span></div><div id="hud-gold">💰 0</div></div><div><b id="hud-name"></b><p id="hud-passive"></p></div></div>
    <div id="hud-skills"></div>
    <div class="bars"><div id="hud-hp"><i></i><span></span></div><div id="hud-mp"><i></i><span></span></div></div>
    <div id="hud-points" class="hidden"></div>
    <div class="bag"><div id="hud-items"></div></div>
    <div id="hud-buffs"></div>
  </div>
  <canvas id="minimap" width="220" height="220"></canvas>
  <div id="hint"></div>
  <div id="channel" class="hidden"><i></i><span></span></div>
  <div id="toast"></div>
  <div id="dead-banner" class="hidden"></div>
  <div id="tabboard" class="hidden"></div>
  <div id="pause" class="hidden"><div class="paper-panel"><h2>暂停</h2><button id="resume">继续游戏</button><button id="quit">回到选人界面</button></div></div>
</section>
<div id="endscreen" class="hidden"></div>
<div id="shop" class="hidden"></div>
<div id="sound-ctl"><button class="btn-sound">音效：开</button><button class="btn-music">音乐：开</button></div>

<script type="module">import './js/main.js';</script>
</body>
</html>
